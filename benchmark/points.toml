# Eight weather points for the NWP features. Each point stands for the voivodeships listed with it; its weights
# are the voivodeships' installed wind and PV capacity and population.
#
# Capacity: URE "Mapa OZE" (licensed and registered installations, state on 2026-06-30, voivodeship sums,
# https://www.ure.gov.pl/pl/oze/potencjal-krajowy-oze/8108) plus about 14 GW of PV micro-installations, which the URE
# list does not contain, spread by population. Population: GUS, 2025-12-31. Only the relative weights matter.
# The weights describe the fleet in mid-2026; they are fixed for the whole benchmark period.

